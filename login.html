<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — CBT Finance</title>
  <meta name="description" content="Login to Chosen Bride Tabernacle Financial Management System" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <main class="center-page">
    <div class="card auth-card">
      <div class="brand">
        <img class="brand-logo" src="images/logo.png" alt="Chosen Bride Logo" />
        <div>
          <h1 class="h2">Church Finance</h1>
          <p class="muted">Chosen Bride Tabernacle</p>
        </div>
      </div>

      <form id="loginForm" class="stack" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
          <div class="help" data-help="username"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <div class="help" data-help="password"></div>
        </div>

        <button class="btn primary" type="submit">Sign in</button>
      </form>

      <div class="hr"></div>
      <div class="muted small" style="text-align: center;">
        <div>Data is stored on this device.</div>
        <button class="btn subtle small mt-10" id="loginHelpBtn" type="button">Why isn't my password working?</button>
      </div>
    </div>
  </main>

  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div id="modalRoot" class="modal-root" aria-hidden="true"></div>

  <script type="module" src="js/db.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
